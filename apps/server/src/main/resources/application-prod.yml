server:
  # 외부 요청은 Caddy(443)가 받아서 127.0.0.1:8080으로 넘긴다. Spring은 외부에서 직접 못 받게 루프백에만 바인딩.
  address: 127.0.0.1
  # Caddy가 붙여주는 X-Forwarded-Proto/Host를 신뢰해서, 생성 URL(Swagger 등)이 https://catchpin.60jong.dev 로 잡히게 한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영 DB는 update로 스키마를 자동으로 건드리면 위험하다 (로컬에서 이미 NOT NULL 컬럼 추가로 두 번 막혔었음).
      # 엔티티를 고쳤는데 여기서 막히면 "엔티티 ↔ 실제 스키마가 안 맞다"는 뜻이니, 마이그레이션(수동 ALTER 등)을 먼저 적용하고 배포할 것.
      ddl-auto: update
