server:
  # 외부 요청은 Caddy(443)가 받아서 127.0.0.1:8080으로 넘긴다. Spring은 외부에서 직접 못 받게 루프백에만 바인딩.
  address: 127.0.0.1
  # Caddy가 붙여주는 X-Forwarded-Proto/Host를 신뢰해서, 생성 URL(Swagger 등)이 https://catchpin.60jong.dev 로 잡히게 한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영 DB는 update로 스키마를 자동으로 건드리면 위험하다 (로컬에서 이미 NOT NULL 컬럼 추가로 두 번 막혔었음).
      # 엔티티를 고쳤는데 여기서 막히면 "엔티티 ↔ 실제 스키마가 안 맞다"는 뜻이니, 마이그레이션(수동 ALTER 등)을 먼저 적용하고 배포할 것.
      ddl-auto: update

# Grafana Cloud로 메트릭/트레이스/로그를 OTLP로 직접 push (EC2에 에이전트 없음).
# GRAFANA_OTLP_ENDPOINT / GRAFANA_OTLP_AUTH 는 EC2의 /etc/catchpin/grafana.env (systemd EnvironmentFile)에서 들어온다.
# 값이 없으면 localhost로 보내다 실패 로그만 남고 앱은 정상 기동한다.
management:
  opentelemetry:
    resource-attributes:
      deployment.environment.name: prod
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: Basic ${GRAFANA_OTLP_AUTH:}
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: Basic ${GRAFANA_OTLP_AUTH:}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: Basic ${GRAFANA_OTLP_AUTH:}
        step: 60s
  tracing:
    export:
      enabled: true
    sampling:
      # 트래픽이 적은 지금은 전부 수집. 무료 한도(traces GB)에 가까워지면 낮출 것
      probability: 1.0
