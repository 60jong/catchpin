spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/pincatch
    username: ${DB_USERNAME:pincatch}
    password: ${DB_PASSWORD:pincatch}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:534259490222-u8921g1s80eheung7a29hiu67aqi0jkq.apps.googleusercontent.com}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 30

push:
  expo:
    url: https://exp.host/--/api/v2/push/send
    # Expo 대시보드에서 Enhanced push security를 켰을 때만 설정
    access-token: ${EXPO_ACCESS_TOKEN:}
