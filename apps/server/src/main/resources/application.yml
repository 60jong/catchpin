spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/catchpin
    username: ${DB_USERNAME:catchpin}
    password: ${DB_PASSWORD:catchpin}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:534259490222-u8921g1s80eheung7a29hiu67aqi0jkq.apps.googleusercontent.com}

kakao:
  oauth:
    # 토큰 aud로 허용할 앱 키들(쉼표로 구분) — REST API 키와/또는 네이티브 앱 키. 서버 로그의 "audience mismatch: [...]"에 실제 aud가 나온다.
    rest-api-key: ${KAKAO_REST_API_KEY:}

logging:
  pattern:
    # 콘솔 로그 줄마다 requestId를 붙인다 (요청 밖의 로그는 빈 값). 규칙은 apps/server/CLAUDE.md의 "로깅" 참고.
    level: "%5p [%X{requestId:-}]"

catchpin:
  pin:
    # 같은 두 사람 사이에서 포인트를 가져간 뒤 다시 핀이 뜨기까지의 시간(시간 단위). 로컬 테스트에서는 0으로 줄여도 된다.
    pair-cooldown-hours: ${CATCHPIN_PIN_PAIR_COOLDOWN_HOURS:24}
  phone:
    # 휴대폰 인증 확인 방식: octomo(기본, 실제 문자를 Octomo로 확인) | dev-approve(개발용, 항상 통과 — 운영에서는 절대 쓰지 않는다)
    provider: ${CATCHPIN_PHONE_PROVIDER:octomo}
  octomo:
    # API 키는 octomo.octoverse.kr 로그인 후 마이페이지에서 받아서 환경변수로만 넣는다 (파일에 적지 않는다)
    api-key: ${OCTOMO_API_KEY:}
    # 사용자가 인증 코드를 문자로 보낼 Octomo 대표번호
    destination-number: ${OCTOMO_DESTINATION_NUMBER:1666-3538}
  dev:
    # 개발용 봇 API(/api/v1/dev/bots) — 운영에서는 꺼 둔다.
    bot-api-enabled: ${CATCHPIN_DEV_BOT_API_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        # 외부(Caddy 경유)에 열리는 actuator는 health 하나뿐 — Grafana Synthetic Monitoring이 이걸 찌른다
        include: health
  opentelemetry:
    resource-attributes:
      service.name: catchpin-server
  metrics:
    distribution:
      # 응답시간 히스토그램 전체 대신 SLO 버킷 3개만 — series 수 절약 + "500ms 넘는 요청 비율" 알림용
      slo:
        http.server.requests: 100ms,500ms,1s
  # 로컬에선 Grafana로 안 보낸다 (기본값이 localhost:4318로 계속 push 시도함). 운영 설정은 application-prod.yml
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
