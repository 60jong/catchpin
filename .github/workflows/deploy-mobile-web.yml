name: Deploy mobile web preview

# main에 모바일 관련 파일이 바뀌어 푸시될 때만 돈다 — 정적으로 내보낸 웹 빌드를 Vercel에 올려서
# 폰 없이도 고정된 URL로 진행 상황을 확인할 수 있게 한다. EC2 서버와는 완전히 별개 배포.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-mobile-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm install --global vercel@latest

      # vercel.json의 buildCommand(expo export --platform web)가 그대로 실행되어 dist/가 만들어진다
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
